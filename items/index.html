<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>중고마켓 | 판다마켓</title>
    <link rel="icon" href="/static/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://unpkg.com/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css"
    />
    <link rel="stylesheet" href="/static/css/reset.css" />
    <link rel="stylesheet" href="/static/css/common.css" />
    <link rel="stylesheet" href="/static/css/products.css" />

  <body>
    <header id="header">
      <div class="inner">
        <h1 id="logo">
          <a href="/"><span class="sr-only">판다마켓</span></a>
        </h1>

        <a href="/login" class="btn-primary btn-sm">로그인</a>
      </div>
    </header>

    <div id="wrapper">
      <div class="inner">
        <div id="product-wrap">
          <section id="best-product">
            <div class="section-header">
              <h2>베스트 상품</h2>
            </div>
          </section>

          <section id="product-list">
            <div class="section-header">
              <h2>판매 중인 상품</h2>

              <div class="product-management">
                <div id="search-form">
                  <form>
                    <input
                      type="text"
                      name="keyword"
                      placeholder="검색할 상품을 입력해주세요"
                    />
                    <button type="submit" class="btn-search">
                      <span class="sr-only">검색</span>
                    </button>
                  </form>
                </div>

                <button type="button">상품 등록하기</button>
              </div>
            </div>

            <ul id="products"></ul>

            <div class="paging"></div>
          </section>
        </div>
      </div>
    </div>

    <footer id="footer">
      <div class="inner">
        <p class="copyright">&copy;codeit - 2026</p>

        <ul class="cs-menu">
          <li><a href="/privacy">Privacy Policy</a></li>
          <li><a href="/faq">FAQ</a></li>

        <ul class="sns-list">

            <a
              href="https://www.facebook.com"
              target="_blank"
              title="페이스북 바로가기(새창)"

          </li>
          <li>
            <a
              href="https://www.x.com"
              target="_blank"
              title="트위터 바로가기(새창)"
              class="twitter"

            >
          </li>
          <li>
            <a
              href="https://www.youtube.com"
              target="_blank"
              title="유튜브 바로가기(새창)"
              class="youtube"
              ><span class="sr-only">유튜브</span></a
            >
          </li>
          <li>
            <a
              href="https://www.instagram.com"
              target="_blank"
              title="인스타그램 바로가기(새창)"
              class="instagram"
              ><span class="sr-only">인스타그램</span></a
