<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>signup</title>
    <link rel="stylesheet" herf="./CSS/reset" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="./CSS/signup.css" />
  </head>
  <body>
    <!-- header -->
    <header>
      <a href="/index.html">
        <img src="#" />
      </a>
    </header>
    <!-- form -->
    <section>
      <form action="#" method="POST">
        <div>
          <label for="email">이메일<br /></label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="이메일을 입력해주세요"
            required
          />
        </div>

        <div>
          <label for="username">닉네임<br /></label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="닉네임을 입력해주세요"
            required
          />
        </div>

        <div>
          <label for="pwd">비밀번호<br /></label>
          <input
            type="password"
            id="pwd"
            name="password"
            placeholder="비밀번호를 입력해주세요"
            required
          />
        </div>

        <div>
          <label for="pwd_check">비밀번호 확인<br /></label>
          <input
            type="password"
            id="pwd_check"
            name="password_check"
            placeholder="비밀번호를 다시 한 번 입력해주세요"
            required
          />
        </div>

        <div>
          <input type="submit" value="회원가입" disabled />
        </div>
      </form>
    </section>
    <!-- bottom -->
    <div class="bottom">
      <div>
        간편 로그인하기
        <a href="#">
          <img src="#" />
        </a>

        <a href="#">
          <img src="#" />
        </a>
      </div>

      <div>
        이미 회원이신가요?
        <a href="/login.html">로그인</a>
      </div>
    </div>
  </body>
</html>
