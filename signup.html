<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container" role="article">
      <div class="login_box">
        <div class="login_logo gap-15" onclick="location.href = 'index.html'">
          <img src="img/판다 얼굴_big.png" alt="" />
          <h1 class="font-ROKAF">판다마켓</h1>
        </div>
        <div class="form_area">
          <form action="">
            <label for="email">이메일</label>
            <input
              id="email"
              name="email"
              type="text"
              placeholder="이메일을 입력해주세요"
              required
              autocomplete="off"
            />
            <label for="nick">닉네임</label>
            <input
              id="nick"
              name="nick"
              type="text"
              placeholder="사용하실 닉네임을 입력해주세요"
              required
              autocomplete="off"
            />
            <label for="pass">비밀번호</label>
            <div class="input_area">
              <input
                id="pass"
                name="pass"
                type="password"
                placeholder="비밀번호를 입력해주세요"
                required
                autocomplete="off"
              />
              <img src="img/icon/btn_visibility_on_24px.png" alt="" />
            </div>
            <label for="passCheck">비밀번호 확인</label>
            <div class="input_area">
              <input
                id="passCheck"
                name="passCheck"
                type="password"
                placeholder="비밀번호를 다시 한 번 입력해주세요"
                required
                autocomplete="off"
              />
              <img src="img/icon/btn_visibility_on_24px.png" alt="" />
            </div>
            <button id="submit_button" type="submit">회원가입</button>
          </form>
        </div>
        <div class="sns_login_area">
          <div class="sns_login_description">간편 로그인하기</div>
          <div class="sns_login_ul">
            <ul>
              <li>
                <a href="https://www.google.com/">
                  <img src="img/icon/Component 2.png" alt="" />
                </a>
              </li>
              <li>
                <a href="https://www.kakaocorp.com/page/">
                  <img src="img/icon/facebook.png" alt="" />
                  <img src="img/icon/99FE484C5C3451F218 1.png" alt="" />
                </a>
              </li>
            </ul>
          </div>
        </div>
        <div class="login_box_footer">
          <p>이미 회원이신가요?</p>
          <a href="login.html">로그인</a>
        </div>
      </div>
    </div>
  </body>
</html>
