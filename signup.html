<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="signup.css" />
    <link rel="stylesheet" href="reset.css" />
  </head>
  <body>
    <div class="total">
      <div class="content">
        <a href="./">
          <img src="./image/panda_icon.png" class="panda_img" />
        </a>
        <div class="email">
          <div class="email_top">이메일</div>
          <input
            type="email"
            class="email_bottom"
            placeholder="이메일을 입력해주세요"
          />
        </div>

        <div class="nickname">
          <div class="nickname_top">닉네임</div>
          <input
            type="text"
            class="nickname_bottom"
            placeholder="닉네임을 입력해주세요"
          />
        </div>
        <div class="password">
          <div class="password_top">비밀번호</div>
          <input
            type="password"
            class="password_bottom"
            placeholder="비밀번호를 입력해주세요"
          />
        </div>

        <div class="password">
          <div class="password_top">비밀번호 확인</div>
          <input
            type="password"
            class="password_bottom"
            placeholder="비밀번호를 다시 한 번 입력해주세요."
          />
        </div>
        <div class="sign">
          <a href="faq.html" class="sign_btn">회원가입</a>
        </div>

        <div class="easy_login">
          <div class="easy_login_content">
            <div class="easy_login_left">간편 로그인하기</div>
            <div class="icon">
              <div>
                <a href="https://www.google.com/" target="_blank">
                  <img src="./image/google.png" />
                </a>
              </div>
              <div>
                <a href="https://www.kakaocorp.com/page/" target="_blank">
                  <img src="./image/kakaotalk.png" />
                </a>
              </div>
            </div>
          </div>
        </div>
        <div class="bottom">
          <div class="bottom_one">이미 회원이신가요?</div>
          <a href="./login.html" class="bottom_two">로그인</a>
        </div>
      </div>
    </div>
  </body>
</html>
