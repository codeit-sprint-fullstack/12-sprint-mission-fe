<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/loginpage.css" />
    <title>로그인 페이지</title>
  </head>
  <body>
    <main>
      <section class="page_section">
        <div class="logo_img">
          <a href="/">
            <img alt="판다마켓 로고 이미지" src="imgs/logo.png"
          /></a>
        </div>

        <div class="login_form_container">
          <div class="id_section">
            <p class="login_text">이메일</p>
            <input
              type="email"
              class="input_form"
              placeholder="이메일을 입력해주세요"
            />
          </div>
          <div class="nickname_section">
            <p class="login_text">닉네임</p>
            <input
              type="email"
              class="input_form"
              placeholder="닉네임을 입력해주세요"
            />
          </div>
          <div class="password_section">
            <p class="login_text">비밀번호</p>
            <input
              type="password"
              class="input_form"
              placeholder="비밀번호를 입력해주세요"
            />
          </div>
          <div class="password_check_section">
            <p class="login_text">비밀번호 확인</p>
            <input
              type="password"
              class="input_form"
              placeholder="비밀번호를 다시 한 번 입력해주세요"
            />
          </div>
        </div>
        <div id="signup_btn">
          <button>회원가입</button>
        </div>

        <div class="simple_login">
          <div>간편 로그인하기</div>
          <div class="login_icons">
            <a href="https://www.google.com/" target="_blank"
              ><img src="imgs/login_img/ic_google_login.png"
            /></a>
            <a href="https://www.kakaocorp.com/" target="_blank"
              ><img src="imgs/login_img/ic_kakao_login.png"
            /></a>
          </div>
        </div>
        <div class="existing_user">
          <div>이미 회원이신가요?</div>

          <div><a href="login.html">로그인</a></div>
        </div>
      </section>
    </main>
  </body>
</html>
