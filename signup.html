<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <link rel="stylesheet" href="reset.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="signup.css" />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-K98MPGXM5R"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-K98MPGXM5R");
    </script>
  </head>
  <body>
    <div class="login_box">
      <form id="login_form" action="">
        <div class="logo">
          <h2><a href="/"></a></h2>
        </div>
        <div class="member_login">
          <div class="member_login_box">
            <label for="email">이메일</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="이메일을 입력해주세요"
            />
          </div>
          <div class="nickname">
            <label>닉네임</label>
            <input
              type="nickname"
              id="nickname"
              name="nickname"
              placeholder="닉네임을 입력해주세요"
            />
          </div>
          <div class="member_login_box">
            <label for="pw">비밀번호</label>
            <div id="pw_input">
              <input
                type="password"
                id="pw"
                name="pw"
                placeholder="비밀번호를 입력해주세요"
              />
              <button class="pw_img"></button>
            </div>
          </div>
          <div class="pw_check">
            <label for="pw_check">비밀번호 확인</label>
            <div id="pw_checkbox">
              <input
                type="password"
                id="pw_check"
                name="pw_check"
                placeholder="비밀번호를 다시 한 번 입력해주세요"
              />
              <button class="pw_img"></button>
            </div>
          </div>
          <button class="login_btn" type="submit">
            <a href="/signup.html">회원가입</a>
          </button>
          <ul class="easy_login">
            <li>간편 로그인하기</li>
            <ul>
              <li class="icon">
                <a class="google" href="https://www.google.com/"></a>
              </li>
              <li class="icon">
                <a class="kakaocorp" href="https://www.kakaocorp.com/page/"></a>
              </li>
            </ul>
          </ul>
          <ul class="find_wrap">
            <li>이미 회원이신가요?</li>
            <li><a href="/login.html">로그인</a></li>
          </ul>
        </div>
      </form>
    </div>
  </body>
</html>
