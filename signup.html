<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>

    <link rel="stylesheet" href="/reset/reset.css" />
    <link rel="stylesheet" href="/css/login-signup.css" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-F83KH668GS"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-F83KH668GS");
    </script>
  </head>

  <body>
    <div class="page">
      <main class="container" aria-label="회원가입">
        <!-- 로고 -->
        <header>
          <a href="/" aria-label="판다마켓 홈으로 이동">
            <img class="logo" src="/images/logo/logo.png" alt="판다마켓 로고" />
          </a>
        </header>

        <!-- 회원가입 폼 -->
        <form class="form" action="/signup.html" method="get">
          <div class="field">
            <label class="label" for="email">이메일</label>
            <input
              class="input"
              id="email"
              name="email"
              type="email"
              placeholder="이메일을 입력해 주세요"
              required
            />
          </div>

          <div class="field">
            <label class="label" for="nickname">닉네임</label>
            <input
              class="input"
              id="nickname"
              name="nickname"
              type="text"
              placeholder="닉네임을 입력해 주세요"
              required
            />
          </div>

          <!-- 비밀번호 -->
          <div class="field">
            <label class="label" for="password">비밀번호</label>

            <div class="pw">
              <input class="pw__toggle" type="checkbox" id="pwToggle1" />
              <input
                class="input pw__input"
                id="password"
                name="password"
                type="password"
                placeholder="비밀번호를 입력해 주세요"
                required
              />

              <label class="pw__eye" for="pwToggle1" aria-label="비밀번호 보기">
                <img class="eye-open" src="/images/icons/eye.svg" alt="" />
                <img
                  class="eye-close"
                  src="/images//icons/eye-off.svg"
                  alt=""
                />
              </label>
            </div>
          </div>

          <!-- 비밀번호 확인 -->
          <div class="field">
            <label class="label" for="passwordConfirm">비밀번호 확인</label>

            <div class="pw">
              <input class="pw__toggle" type="checkbox" id="pwToggle2" />
              <input
                class="input pw__input"
                id="passwordConfirm"
                name="passwordConfirm"
                type="password"
                placeholder="비밀번호를 다시 한 번 입력해 주세요"
                required
              />

              <label
                class="pw__eye"
                for="pwToggle2"
                aria-label="비밀번호 확인 보기"
              >
                <img class="eye-open" src="/images/icons/eye.svg" alt="" />
                <img class="eye-close" src="/images/icons/eye-off.svg" alt="" />
              </label>
            </div>
          </div>

          <button class="login-btn" type="submit">회원가입</button>
        </form>

        <!-- 간편 로그인 -->
        <section class="social-box" aria-label="간편 로그인하기">
          <span>간편 로그인하기</span>

          <div class="social-icons">
            <a
              href="https://www.google.com/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Google로 이동"
            >
              <img src="/images//social/google.svg" alt="구글" />
            </a>
            <a
              href="https://www.kakaocorp.com/page/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Kakao로 이동"
            >
              <img src="/images/social/kakao.svg" alt="카카오" />
            </a>
          </div>
        </section>

        <!-- 하단 링크: 로그인으로 -->
        <p class="bottom-text">
          이미 회원이신가요?
          <a href="/login.html">로그인</a>
        </p>
      </main>
    </div>
  </body>
</html>
