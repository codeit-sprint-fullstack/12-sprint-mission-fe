  <body>
    <!-- GNB -->
    <nav class="global-nav-bar">
      <div class="gnb-container">
        <a href="/">
          <img src="./images/pm_logo.png" alt="판다마켓 로고" class="pm-logo" />
        </a>
        <a class="pm-login-btn" href="./login.html">로그인</a>
      </div>

    <!-- HERO -->
    <section class="pm-home-hero">
      <div class="pm-home-hero-container">
        <div class="pm-home-hero-detail">
          <h1 class="hero-title">
            일상의 모든 물건을<br />
            거래해 보세요
          </h1>
          <a href="./items.html" class="pm-items-btn">구경하러 가기</a>
        </div>
        <img
          src="./images/Img_home_top.png"
          alt="판다마켓 홈 탑 이미지"
          class="pm-home-hero-img"
        />
      </div>
    </section>

    <!-- 첫 번째 main 영역 -->
    <section class="pm-section pm-section-1">
      <div class="pm-section-div">
        <img
          src="./images/Img_home_01.png"
          alt="인기 상품을 확인해보세요"
          class="section-img"
        />
        <div class="section-content">
          <p class="section-keyword">Hot item</p>
          <div class="section-detail">
            <h2 class="hero-title section-title">
              인기 상품을<br />

              가장 HOT한 중고거래 물품을<br />

            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- 두 번째 main 영역 -->
    <section class="pm-section pm-section-2">
      <div class="pm-section-div">
        <div class="section-content">
          <p class="section-keyword">Search</p>
          <div class="section-detail">
            <h2 class="hero-title section-title">
              구매를 원하는<br />
              상품을 검색하세요
            </h2>
            <p class="section-para">
              구매하고 싶은 물품은 검색해서<br />
              쉽게 찾아보세요
            </p>
          </div>
        </div>
        <img
          src="./images/Img_home_02.png"
          alt="구매를 원하는 상품을 검색하세요"
          class="section-img"
        />
      </div>
    </section>

    <!-- 세 번째 main 영역 -->
    <section class="pm-section pm-section-3">
      <div class="pm-section-div">
        <img
          src="./images/Img_home_03.png"
          alt="판매를 원하는 상품을 등록하세요"
          class="section-img"
        />
        <div class="section-content">
          <p class="section-keyword">Register</p>
          <div class="section-detail">
            <h2 class="hero-title section-title">
              판매를 원하는<br />
              상품을 등록하세요
            </h2>
            <p class="section-para">
              어떤 물건이든 판매하고 싶은 상품을<br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- BOTTOM -->
    <section class="pm-home-bottom">
      <div class="pm-home-bottom-container">
        <h2 class="hero-title pm-home-bottom-detail">
          믿을 수 있는<br />판다마켓 중고 거래

        <img
          src="./images/Img_home_bottom.png"
          alt="판다마켓 홈 바텀 이미지"
          class="pm-home-bottom-img"
        />

        <div class="pm-footer-el pm-footer-center">
          <a href="./privacy.html" class="pm-footer-opt">Privacy Policy</a>
          <a href="./faq.html" class="pm-footer-opt">FAQ</a>

        <div class="pm-footer-el pm-footer-right">
