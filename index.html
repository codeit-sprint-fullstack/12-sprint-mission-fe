<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>판다마켓</title>
  <link rel="stylesheet" href="reset.css" />
  <link rel="stylesheet" href="panda.css" />
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="header-logo">
        <a href="/"><img src="./img/logo.png"></a>
      </div>
      <div class="header-login">
        <a href="./login.html" target="_blank">로그인</a>
      </div>
    </div>
  </header>

  <section class="top">
    <div class="top-container">
      <div class="top-left">
        <h1>일상의 모든 물건을<br> 거래해 보세요</h1>
        <a class="top-left-go" href="./items.html" target="_blank">구경하러 가기</a>
      </div>

      <div class="top-right">
        <img src="./img/Img_home_top.png">
      </div>
    </div>
  </section>

  <main>
    <section class="main-section">
      <div class="main-container">
        <div class="main-inner">
          <div class="main-img">
            <img src="./img/Img_home_01.png">
          </div>
          <div class="main-text">
            <p class="main-label-p">Hot Items</p>
            <h3>인기 상품을 <br>
              확인해 보세요
            </h3>
            <p class="main-p">가장 HOT한 중고거래 물품을<br>
              판다 마켓에서 확인해 보세요</p>
          </div>
        </div>
      </div>
    </section>

    <section class="main-section reverse">
      <div class="main-container">
        <div class="main-inner">
          <div class="main-img">
            <img src="./img/Img_home_02.png">
          </div>
          <div class="main-text">
            <p class="main-label-p">Search</p>
            <h3>구매를 원하는 <br>
              상품을 검색하세요
            </h3>
            <p class="main-p">구매하고 싶은 물품은 검색해서<br>
              쉽게 찾아보세요</p>
          </div>
        </div>
      </div>
    </section>

    <section class="main-section">
      <div class="main-container">
        <div class="main-inner">
          <div class="main-img">
            <img src="./img/Img_home_03.png">
          </div>
          <div class="main-text">
            <p class="main-label-p">Register</p>
            <h3>판매를 원하는<br>
              상품을 등록하세요
            </h3>
            <p class="main-p">어떤 물건이든 판매하고 싶은 상품을<br>
              쉽게 등록하세요</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <section class="bottom">
    <div class="container">
      <div class="bottom-left">
        <h1>믿을 수 있는<br>
          판다마켓 중고 거래
        </h1>
      </div>
      <div class="bottom-right">
        <img src="./img/Img_home_bottom.png">
      </div>
    </div>
  </section>

  <footer>
    <div class="footer-inner">
      <p class="footer-left">©codeit - 2024</p>
      <div class="footer-center">
        <a class="footer-text" href="#" target="_blank">Privacy Policy</a>
        <a class="footer-text" href="#" target="_blank">FAQ</a>

      </div>
      <div class="footer-right">
        <a href="https://www.facebook.com" target="_blank">
          <img src="./img/ic_facebook.png">
        </a>
        <a href="https://www.twitter.com" target="_blank">
          <img src="./img/ic_twitter.png">
        </a>
        <a href="https://www.youtube.com" target="_blank">
          <img src="./img/ic_youtube.png">
        </a>
        <a href="https://www.instagram.com" target="_blank">
          <img src="./img/ic_instagram.png">
        </a>
      </div>
    </div>

  </footer>
</body>

</html>
