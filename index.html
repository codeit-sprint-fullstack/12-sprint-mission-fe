<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="reset.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css"
    />
    <link rel="stylesheet" href="style.css" />

      async
      src="https://www.googletagmanager.com/gtag/js?id=G-K98MPGXM5R"

      gtag("config", "G-K98MPGXM5R");

  <body>
    <!--헤더 영역-->
    <header>
      <nav>
        <h2 class="logo">
          <a href="/"><img src="img/Group 19.png" alt="logo" /></a>
        </h2>
        <a href="login.html" class="login">
          <button class="login_btn">로그인</button>
        </a>
      </nav>
    </header>
    <!--메인영역-->
    <main>
      <section id="hero">
        <div>
          <div>
            <p class="txt_01">일상의 모든 물건을<br />거래해 보세요</p>
            <a class="going">구경하러 가기</a>
          </div>
          <img src="img/Img_home_top.png" alt="home" />
        </div>
      </section>
      <section id="item">
        <div class="hot_item">
          <img src="img/Img_home_01.png" alt="hot item" />
          <div class="main_txtbox">
            <p class="name">Hot item</p>
            <div>
              <p class="txt_01">인기 상품을<br />확인해 보세요</p>
              <p class="txt_02">
                가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section id="search">
        <div class="search_sec">
          <div class="main_txtbox">
            <p class="name">Search</p>
            <div>
              <p class="txt_01">구매를 원하는<br />상품을 검색하세요</p>
              <p class="txt_02">
                구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
              </p>
            </div>
          </div>
          <img src="img/Img_home_02.png" alt="search" />
        </div>
      </section>
      <section id="register">
        <div class="register_sec">
          <img src="img/Img_home_03.png" alt="register" />
          <div class="main_txtbox">
            <p class="name">Register</p>
            <div>
              <p class="txt_01">판매를 원하는<br />상품을 등록하세요</p>
              <p class="txt_02">
                어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section id="bottom">
        <div>
          <p class="txt_01">믿을 수 있는<br />판다마켓 중고 거래</p>
          <img src="img/Img_home_bottom.png" alt="img_bottom" />
        </div>
      </section>
    </main>
    <!--푸터영역-->
    <footer>
      <div class="footer_in">
        <div class="since">
          <span>©codeit - 2024</span>
        </div>
        <div>
          <ul class="helpcenter">
            <li><a href="/privacy.html" class="click">Privacy Policy</a></li>
            <li><a href="/faq.html" class="click">FAQ</a></li>
          </ul>
        </div>
        <div>
          <ul class="sns">
            <li>
              <a href="https://facebook.com" target="_blank" class="click"
                ><img src="img/ic_facebook.png" alt="facebook"
              /></a>
            </li>
            <li>
              <a href="https://twitter.com" target="_blank" class="click"
                ><img src="img/ic_twitter.png" alt="twitter"
              /></a>
            </li>
            <li>
              <a href="https://youtube.com" target="_blank" class="click"
                ><img src="img/ic_youtube.png" alt="youtube"
              /></a>
            </li>
            <li>
              <a href="https://www.instagram.com" target="_blank" class="click"
                ><img src="img/ic_instagram.png" alt="instar"
              /></a>
            </li>
          </ul>
        </div>
      </div>
    </footer>
  </body>
</html>
