<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./CSS/reset.css" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="./CSS/index.css" />
  </head>
  <body>
    <!-- 고정 헤더 -->
    <div class="top">
      <div class="top_container">
        <a href="/">
          <img src="./images/logo_index.svg" alt="판다 얼굴" />
        </a>
        <a class="login" href="./login.html">로그인</a>
      </div>
    </div>

    <!-- hero -->
    <div class="hero">
      <div class="hero_container">
        <div class="hero_content">
          일상의 모든 물건을<br />거래해 보세요
          <a class="go" href="./items.html"> 구경하러 가기 </a>
        </div>
        <img src="./images/Img_home_top.svg" alt="판다 집 간다." />
      </div>
    </div>

    <!-- main -->
    <div class="main">
      <div class="set1">
        <img src="./images/Img_home_01.svg" alt="판다 둘, 옷 보며 하트" />
        <div class="frame1">
          <p class="keyword">Hot item</p>
          <p class="set_t">인기 상품을<br />확인해 보세요</p>
          <p class="set_t2">
            가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
          </p>
        </div>
      </div>

      <div class="set2">
        <div class="frame2">
          <p class="keyword">Search</p>
          <p class="set_t">구매를 원하는<br />상품을 검색하세요</p>
          <p class="set_t2">
            가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
          </p>
        </div>
        <img src="./images/Img_home_02.svg" alt="돋보기" />
      </div>

      <div class="set3">
        <img src="./images/Img_home_03.svg" alt="폴더, 요술봉,연필, 책, 안경" />

        <div class="frame3">
          <p class="keyword">Register</p>
          <p class="set_t">판매를 원하는<br />상품을 등록하세요</p>
          <p class="set_t2">
            어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
          </p>
        </div>
      </div>
    </div>

    <!-- footer -->
    <div class="footer">
      <div class="footer_container">
        <p>믿을 수 있는<br />판다마켓 중고 거래</p>
        <img src="./images/Img_home_bottom.svg" atl="판다 둘 집 간다" />
      </div>
    </div>

    <!-- bottom -->
    <div class="bottom">
      <div class="t1">©codeit - 2024</div>
      <div class="t2">
        <a class="landing" href="./privacy.html">Privacy Policy</a>
        <a class="landing" href="./faq.html">FAQ</a>
      </div>
      <div class="t3">
        <a href="https://www.facebook.com/" target="_blank">
          <img src="./images/ic_facebook.svg" alt="ic_facebook" />
        </a>
        <a href="https://x.com/" target="_blank">
          <img src="./images/ic_twitter.svg" alt="ic_twitter" />
        </a>
        <a href="https://www.youtube.com/" target="_blank">
          <img src="./images/ic_youtube.svg" alt="ic_youtube" />
        </a>
        <a href="https://www.instagram.com/" target="_blank">
          <img src="./images/ic_instagram.svg" alt="ic_instagram" />
        </a>
      </div>
    </div>

</html>
