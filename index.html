      <section>
        <div class="promotion">

            <img src="./img/landing/Img_home_01.png" alt="Hot Item" />

              <p class="badge">Hot item</p>
              <h1 class="title">
                인기 상품을<br />

              </h1>
            </div>
          </div>
        </div>
      </section>
      <section>
        <div class="promotion">

                구매하고 싶은 물품은 검색해서 <br />

              </h1>

            <img src="./img/landing/Img_home_02.png" alt="Search" />
          </div>
        </div>
      </section>
      <section>
        <div class="promotion">
          <div class="card">
            <img src="./img/landing/Img_home_03.png" alt="Register" />

              <h1 class="title">
                판매를 원하는<br />

      <section>
        <div class="landing">

                믿을 수 있는<br />
