<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="head">
      <a href="/">
        <div class="logo flex-center">
          <img class="logo-panda" src="판다 얼굴.png" alt="판다마켓 로고" />
          <span class="logo-name">판다마켓</span>
        </div>
      </a>
      <a href="/login" class="btn btn-login">로그인</a>
    </header>
    <main class="home">
      <div class="flex-center in-home">
        <div class="top-content">
          <h2>
            일상의 모든 물건을 <br />
            거래해 보세요
          </h2>
          <a href="/items" class="btn btn-home">구경하러 가기 </a>
        </div>
        <img class="img-wide" src="Img_home_top.png" alt="Home-Top" />
      </div>
    </main>
    <section class="sec">
      <div class="flex-center in-sec">
        <img class="img-sec" src="Img_home_01.png" alt="Hot-item" />
        <div class="content">
          <p class="badge">Hot item</p>
          <h2 class="sec-h2">
            인기 상품을 <br />
            확인해 보세요
          </h2>
          <p>
            가장 HOT한 중고거래 물품을 <br />
            판다 마켓에서 확인해 보세요
          </p>
        </div>
      </div>
    </section>
    <section class="sec">
      <div class="flex-center in-sec reverse">
        <img class="img-sec" src="Img_home_02.png" alt="Search" />
        <div class="content">
          <p class="badge">Search</p>
          <h2 class="sec-h2">
            구매를 원하는 <br />
            상품을 검색하세요
          </h2>
          <p>
            구매하고 싶은 물품은 검색해서 <br />
            쉽게 찾아보세요
          </p>
        </div>
      </div>
    </section>
    <section class="sec">
      <div class="flex-center in-sec">
        <img class="img-sec" src="Img_home_03.png" alt="Register" />
        <div class="content">
          <p class="badge">Register</p>
          <h2 class="sec-h2">
            판매를 원하는 <br />
            상품을 등록하세요
          </h2>
          <p>
            어떤 물건이든 판매하고 싶은 상품을 <br />
            쉽게 등록하세요
          </p>
        </div>
      </div>
    </section>
    <footer class="home bottom">
      <div class="flex-center in-home">
        <div class="bottom-content">
          <h2>
            믿을 수 있는 <br />
            판다마켓 중고 거래
          </h2>
        </div>
        <img class="img-wide" src="Img_home_bottom.png" alt="Home-Bottom" />
      </div>
      <aside class="etc">
        <p class="codeit">ⓒcodeit - 2024</p>
        <div class="etc-link">
          <a class="etc-text" href="/privacy">Privacy Policy</a>
          <a class="etc-text" href="/faq">FAQ</a>
        </div>
        <div class="etc-sns">
          <a
            href="https://www.facebook.com/?locale=ko_KR"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img class="sns-ic" src="ic_facebook.png" alt="facebook" />
          </a>
          <a
            href="https://x.com/?lang=ko"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img class="sns-ic" src="ic_twitter.png" alt="twitter" />
          </a>
          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img class="sns-ic" src="ic_youtube.png" alt="youtube" />
          </a>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img class="sns-ic" src="ic_instagram.png" alt="instagram" />
          </a>
        </div>
      </aside>
    </footer>
  </body>
</html>
