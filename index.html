<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <!-- gnb -->

  <body>
    <div class="gnb">
      <div class="gnb-container">
        <a href="/" class="logo">
          <img src="./img/logo.png" alt="판다마켓 로고" />
        </a>
        <a href="./login.html" class="login-btn">로그인</a>
      </div>
    </div>

    <!-- hero -->

    <div class="hero">
      <div class="hero-container">
        <div class="hero-text">
          <h2 class="text">일상의 모든 물건을<br />거래해 보세요</h2>
          <a href="/items" class="cta-btn">구경하러 가기</a>
        </div>

        <img class="hero-image" src="./img/Img_home_top.png" />
      </div>
    </div>

    <!-- section -->

    <section id="features" class="wrapper">
      <div class="feature">
        <img src="img/Frame 2608833.png" alt="인기 상품" width="50%" />
        <div class="feature-content">
          <h2 class="feature-tag">Hot item</h2>
          <h1>인기 상품을<br />확인해 보세요</h1>
          <p class="feature-description">
            가장 HOT한 중고거래 물품을<br />판다마켓에서 확인해 보세요
          </p>
        </div>
      </div>

      <div class="feature">
        <div class="feature-content" id="feature-content2">
          <h2 class="feature-tag">Search</h2>
          <h1>구매를 원하는<br />상품을 검색하세요</h1>
          <p class="feature-description">
            구매하고 싶은 물품은 검색해서
            <br />쉽게 찾아보세요
          </p>
        </div>
        <img src="img/Img_home_02.png" alt="검색 기능" width="50%" />
      </div>

      <div class="feature">
        <img src="img/Img_home_03.png" alt="판매 상품 등록" width="50%" />
        <div class="feature-content">
          <h2 class="feature-tag">Register</h2>
          <h1>판매를 원하는<br />상품을 등록하세요</h1>
          <p class="feature-description">
            어떤 물건이든 판매하고 싶은 상품을
            <br />쉽게 등록하세요
          </p>
        </div>
      </div>
    </section>

    <!-- bottom -->

    <div class="bottom">
      <div class="bottom-container">
        <h2 class="text2">믿을 수 있는<br />판다마켓 중고 거래</h2>
        <img class="bottom-image" src="./img/Img_home_bottom.png" />
      </div>
    </div>

    <!-- footer -->
    <footer class="footer">
      <div class="inner footer-inner">
        <div class="left">@codeit-2024</div>

        <div class="center">
          <a href="/privacy">Privacy Policy</a>
          <a href="/faq">FAQ</a>
        </div>

        <div class="right">
          <a href="https://facebook.com" target="_blank" class="sns">
            <i class="fab fa-facebook-f"></i>
          </a>

          <a href="https://twitter.com" target="_blank" class="sns">
            <i class="fab fa-twitter"></i>
          </a>

          <a href="https://youtube.com" target="_blank" class="sns">
            <i class="fab fa-youtube"></i>
          </a>

          <a href="https://instagram.com" target="_blank" class="sns">
            <i class="fab fa-instagram"></i>
          </a>
        </div>
      </div>
    </footer>
  </body>
</html>
