<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/mainpage.css" />
  </head>
  <body>
    <main>
      <header id="panda_header">
        <div class="logo_group">
          <a href="/">
            <img src="imgs/panda_icon.png" alt="판다마켓 로고" />
            <span id="panda_first_name">판다마켓</span>
          </a>
        </div>
        <a id="login_btn" href="login.html">로그인</a>
      </header>

      <section class="panda_img_text">
        <div class="tb_container">
          <div class="tb_text_box">
            <h1>일상의 모든 물건을 <br />거래해 보세요</h1>
            <a class="cta_btn" href="items.html"> 구경하러 가기 </a>
          </div>
          <div class="img_box">
            <img src="imgs/Img_home_top.png" alt="판다 홈 이미지" />
          </div>
        </div>
      </section>

      <section class="feature_section">
        <div class="container">
          <div class="img_box">
            <img
              src="imgs/Img_home_01.png"
              alt="판다 메인 이미지1"
              class="feature_img"
            />
          </div>

          <div class="text_box">
            <span class="blue_label">Hot Item</span>

            <h2>인기 상품을<br />확인해 보세요</h2>
            <p class="sub_text">
              가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
      </section>

      <section class="feature_section">
        <div class="container reverse">
          <div class="text_box">
            <span class="blue_label">Search</span>
            <h2>
              구매를 원하는<br />
              상품을 검색하세요
            </h2>
            <p class="sub_text">
              구매하고 싶은 물품을 검색해서 <br />쉽게 찾아보세요
            </p>
          </div>
          <div class="img_box">
            <img src="imgs/Img_home_02.png" alt="검색 이미지" />
          </div>
        </div>
      </section>

      <section class="feature_section">
        <div class="container">
          <div class="img_box">
            <img src="imgs/Img_home_03.png" alt="판다 메인 이미지3" />
          </div>
          <div class="text_box">
            <span class="blue_label">Register</span>
            <h2>판매를 원하는<br />상품을 등록하세요</h2>
            <p class="sub_text">
              어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section class="panda_img_text">
        <div class="tb_container">
          <div class="tb_text_box_bottom">
            <p>믿을 수 있는 <br />판다마켓 중고 거래</p>
          </div>
          <div class="img_box">
            <img src="imgs/Img_home_bottom.png" alt="판다 바텀 이미지" />
          </div>
        </div>
      </section>
    </main>
    <footer class="footer">
      <div class="footer_container">
        <div class="info">©codeit - 2024</div>
        <div class="footer_links">
          <a href="privacy.html">Privacy Policy</a>
          <a href="faq.html">FAQ</a>
        </div>

        <div class="Social">
          <a href="https://www.facebook.com/" target="_blank"
            ><img src="imgs/footer_img/ic_facebook.png"
          /></a>
          <a href="https://x.com/" target="_blank"
            ><img src="imgs/footer_img/ic_twitter.png"
          /></a>
          <a href="https://www.youtube.com/" target="_blank"
            ><img src="imgs/footer_img/ic_youtube.png"
          /></a>
          <a href="https://www.instagram.com/" target="_blank"
            ><img src="imgs/footer_img/ic_instagram.png"
          /></a>
        </div>
      </div>
    </footer>
  </body>
</html>
