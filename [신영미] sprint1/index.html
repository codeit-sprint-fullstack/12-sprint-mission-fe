<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
  </head>
  <link rel="stylesheet" href="style.css" />

  <body>
    <header>
      <nav class="gnb">
        <div class="logo">
          <img
            src="이미지/로고1.png"
            alt="Panda Market Logo"
            height="50px"
            width="150px"
          />
          <button class="login">
            <a href="login.html">로그인</a>
          </button>
        </div>
      </nav>
    </header>

    <main>
      <div class="hero">
        <div class="ractangle">
          <span class="ractangle-left">
            <p class="hero-text">일상의 모든 물건을<br />거래해 보세요</p>
            <button class="hero-button">
              <a href="/items">구경하러 가기</a>
            </button>
          </span>
          <span class="ractangle-right">
            <img src="이미지/히어로그림.png" alt="hero Image1" />
          </span>
        </div>
      </div>
      <div class="main">
        <div class="section">
          <img
            src="이미지/문단1그림.png"
            alt="section Image"
            width="588px"
            height="444px"
          />
          <span class="section-text1">
            <p class="bluetag">hot item</p>
            <p class="title">인기 상품을<br />확인해 보세요</p>
            <p class="text">
              가장 HOT한 중고거래 물품을<br />
              판다 마켓에서 확인해 보세요
            </p>
          </span>
        </div>
      </div>
      <div class="main">
        <div class="section">
          <span class="section-text2">
            <p class="bluetag">Search</p>
            <p class="title">구매를 원하는<br />상품을 검색하세요</p>
            <p class="text">
              구매하고 싶은 물품은 검색해서<br />
              쉽게 찾아보세요
            </p>
          </span>
          <img
            src="이미지/문단2그림.png"
            alt="section Image"
            width="588px"
            height="444px"
          />
        </div>
      </div>
      <div class="main">
        <div class="section">
          <img
            src="이미지/문단3그림.png"
            alt="section Image"
            width="588px"
            height="444px"
          />
          <span class="section-text1">
            <p class="bluetag">Register</p>
            <p class="title">판매를 원하는<br />상품을 등록하세요</p>
            <p class="text">
              어떤 물건이든 판매하고 싶은 상품을<br />
              쉽게 등록하세요
            </p>
          </span>
        </div>
      </div>
      <div class="hero">
        <div class="ractangle">
          <span class="ractangle-left">
            <p class="hero-text">믿을 수 있는<br />판다마켓 중고 거래</p>
          </span>
          <span class="ractangle-right">
            <img src="이미지/하단1그림.png" alt="hero Image2" />
          </span>
        </div>
      </div>
    </main>

    <footer>
      <nav class="footer">
        <div class="right">
          <span class="left-text">@codeit-2024</span>
          <span class="center-text">
            <a href="/privacy">Privacy Policy</a>
            <a href="/faq">FAQ</a>
          </span>
          <span class="sns-logo">
            <a href="https://www.facebook.com" target="_blank"
              ><img src="이미지/ic_facebook.png" alt="facebook logo"
            /></a>
            <a href="https://www.twitter.com" target="_blank"
              ><img src="이미지/ic_twitter.png" alt="twitter logo"
            /></a>
            <a href="https://www.youtube.com" target="_blank"
              ><img src="이미지/ic_youtube.png" alt="youtube logo"
            /></a>
            <a href="https://www.instagram.com" target="_blank"
              ><img src="이미지/ic_instagram.png" alt="instagram logo"
            /></a>
          </span>
        </div>
      </nav>
    </footer>
  </body>
</html>
