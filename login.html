<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body>
    <!-- logo -->
    <div class="container">

      <div class="logo">
      <a href="/" class="logo">
        <img src="./img/logo.png" />
      </a>
    </div>

    <section class="form-text">
      
        <lable class="lable1">이메일</lable>
        <div class="input-box">
        <input type="email" placeholder="이메일을 입력해주세요" />
      </div>

      <div class="for-text">
        <lable class="lable1">비밀번호</lable>

      <div class="input-box">
       <input type="password" placeholder="비밀번호를 입력해주세요">
       <img src="./img/eye.png" alt="비밀번호 보기" class="eye-icon">
      </div>

      </div>

      <button type="submit" class="login-btn">로그인</button>
    </section>

    <div class="social-login-box">
        <span class="social-text">간편 로그인하기</span>

        <div class="social-icons">
          <a href="https://www.google.com/">
          <img src="./img/google.png" alt="구글 로그인" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
          <img src="./img/kakao.png" alt="카카오 로그인" />
          </a>
        </div>

    </div>
    <p class="signup">
      판다마켓이 처음이신가요? <a href="/signup">회원가입</a>
    </p>
  </body>
</html>
