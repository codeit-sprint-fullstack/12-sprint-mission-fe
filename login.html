<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main>
      <header class="header">
        <a class="logo" href="index.html">
          <img src="/판다 얼굴.png" alt="판다마켓 로고" />
          <div>판다마켓</div>
        </a>
      </header>
      <section class="form">
        <form>
          <label for="email">이메일<br /></label>
          <input
            type="text"
            placeholder="이메일을 입력해주세요"
            id="email"
            name="email"
          />
        </form>
        <form>
          <label for="username">비밀번호<br /></label>
          <input
            type="password"
            placeholder="비밀번호를 입력해주세요"
            id="password"
            name="password"
          />
        </form>
        <button type="submit" disabled>로그인</button>
        <section class="simple-login-box">
          <div class="simple-login">
            <p>간편 로그인하기</p>
            <div class="simple-ic">
              <a href="https://www.google.com/">
                <img
                  class="simple-login-ic"
                  src="ic-login-google.png"
                  alt="google"
              /></a>
              <a href="https://www.kakaocorp.com/page/">
                <img
                  class="simple-login-ic"
                  src="ic-login-kakao.png"
                  alt="kakao"
              /></a>
            </div>
          </div>
        </section>
      </section>
      <footer>
        <div class="signup">
          <p>판다마켓이 처음이신가요?</p>
          <a href="signup.html">회원가입</a>
        </div>
      </footer>
    </main>
  </body>
</html>
