<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/loginpage.css" />
    <title>로그인 페이지</title>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-PB0XM30FJ8"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-PB0XM30FJ8");
    </script>
    <!-- google tag end point-->
  </head>
  <body>
    <main class="login">
      <section class="login__container">
        <h1 class="login__logo">
          <a class="login__logo-link" href="/">
            <img class="login__logo-image" src="imgs/logo.png" alt="판다마켓" />
          </a>
        </h1>

        <form class="login__form">
          <div class="login__field">
            <label class="login__label" for="email">이메일</label>
            <input
              class="login__input"
              id="email"
              name="email"
              type="email"
              placeholder="이메일을 입력해주세요"
              autocomplete="email"
            />
          </div>

          <div class="login__field">
            <label class="login__label" for="password">비밀번호</label>
            <div class="login__input-wrap login__input-wrap--password">
              <input
                class="login__input"
                id="password"
                name="password"
                type="password"
                placeholder="비밀번호를 입력해주세요"
                autocomplete="current-password"
              />
              <button
                class="login__toggle"
                type="button"
                aria-label="비밀번호 보기"
              >
                <img src="imgs/btn_visibility_off_24px.svg" />
              </button>
            </div>
          </div>

          <button class="login__submit" type="submit">로그인</button>
        </form>

        <section class="login__social" aria-label="간편 로그인">
          <p class="login__social-text">간편 로그인하기</p>
          <div class="login__social-icons">
            <a
              class="login__social-link"
              href="https://www.google.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img src="imgs/login_img/ic_google_login.png" alt="구글 로그인" />
            </a>
            <a
              class="login__social-link"
              href="https://www.kakaocorp.com/"
              target="_blank"
              rel="noopener noreferrer"
            >
              <img
                src="imgs/login_img/ic_kakao_login.png"
                alt="카카오 로그인"
              />
            </a>
          </div>
        </section>

        <p class="login__signup">
          판다마켓이 처음이신가요?
          <a class="login__signup-link" href="signup.html">회원가입</a>
        </p>
      </section>
    </main>
  </body>
</html>
