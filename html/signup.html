<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>signup</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/login-signup.css" />
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-2PQ2ZZYB15"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-2PQ2ZZYB15");
    </script>
  </head>
  <body>
    <main class="login-main">
      <div class="login-container">
        <a class="login-logo-container" href="./">
          <img src="../images/login/판다 얼굴.png" alt="판다 로고 얼굴" />
          <img src="../images/login/판다마켓.png" alt="판다 로고 글씨" />
        </a>
        <div class="content-container">
          <form class="login-form" action="/submit" method="POST">
            <div class="input-container">
              <div class="email-container">
                <label for="email">이메일</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="이메일을 입력해주세요"
                  required
                />
              </div>
              <div class="nickname-container">
                <label for="nickname">닉네임</label>
                <input
                  type="text"
                  id="nickname"
                  name="nickname"
                  placeholder="닉네임을 입력해주세요"
                  required
                />
              </div>
              <div class="password-container">
                <label for="password">비밀번호</label>
                <div class="password-input-container">
                  <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="비밀번호를 입력해주세요"
                    required
                  />
                  <img
                    class="invisible-icon"
                    src="../images/login/btn_visibility_off_24px.png"
                  />
                  <img
                    class="visible-icon"
                    src="../images/login/btn_visibility_on_24px.svg"
                  />
                </div>
              </div>
              <div class="password-check-container">
                <label for="password-check">비밀번호 확인</label>
                <div class="password-input-container">
                  <input
                    type="password"
                    id="password-check"
                    name="password-check"
                    placeholder="비밀번호를 다시 한 번 입력해주세요"
                    required
                  />
                  <img
                    class="invisible-icon"
                    src="../images/login/btn_visibility_off_24px.png"
                  />
                  <img
                    class="visible-icon"
                    src="../images/login/btn_visibility_on_24px.svg"
                  />
                </div>
              </div>
            </div>

            <button class="login-button" type="submit">
              <div class="login-text">회원가입</div>
            </button>
          </form>
          <div class="easy-login">
            <div class="easy-login-container">
              <div class="easy-login-text">간편 로그인하기</div>
              <div class="sns-img-container">
                <a
                  class="google"
                  href="https://www.google.com/"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  <img
                    src="../images/login/google.png"
                    alt="google logo image"
                  />
                </a>
                <a
                  class="kakaotalk"
                  href="https://www.kakaocorp.com/page/"
                  targer="_blank"
                  rel="noopener noreferrer"
                >
                  <img
                    src="../images/login/kakaotalk.png"
                    alt="kakaotalk logo image"
                  />
                </a>
              </div>
            </div>
          </div>

          <div class="ask-login-signup-container">
            <span class="ask-text">이미 회원이신가요?</span>
            <a class="login-signup-link" href="./login.html">로그인</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
